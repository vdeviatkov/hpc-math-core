<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img">
<title>Eight CUDA GEMM levels on an RTX 5080</title>
<rect width="1000" height="510" fill="white"/>
<g font-family="Arial, sans-serif" fill="#172635">
<text x="500" y="34" font-size="23" text-anchor="middle">Eight CUDA GEMM levels on an RTX 5080</text>
<text x="500" y="61" font-size="14" text-anchor="middle">N = 4096 · GPU time of the GEMM alone · levels 5–7 and cuBLAS FP16 multiply in fp16</text>
<path d="M 250.0 92 V 420" stroke="#dce2e8"/>
<text x="250.0" y="440" font-size="12" text-anchor="middle">0</text>
<path d="M 354.61538461538464 92 V 420" stroke="#dce2e8"/>
<text x="354.61538461538464" y="440" font-size="12" text-anchor="middle">20</text>
<path d="M 459.2307692307692 92 V 420" stroke="#dce2e8"/>
<text x="459.2307692307692" y="440" font-size="12" text-anchor="middle">40</text>
<path d="M 563.8461538461538 92 V 420" stroke="#dce2e8"/>
<text x="563.8461538461538" y="440" font-size="12" text-anchor="middle">60</text>
<path d="M 668.4615384615385 92 V 420" stroke="#dce2e8"/>
<text x="668.4615384615385" y="440" font-size="12" text-anchor="middle">80</text>
<path d="M 773.0769230769231 92 V 420" stroke="#dce2e8"/>
<text x="773.0769230769231" y="440" font-size="12" text-anchor="middle">100</text>
<path d="M 877.6923076923077 92 V 420" stroke="#dce2e8"/>
<text x="877.6923076923077" y="440" font-size="12" text-anchor="middle">120</text>
<text x="238" y="120" font-size="14" text-anchor="end">0  naive</text>
<rect x="250" y="106" width="19.2" height="20" fill="#245ea8"/>
<text x="277.2492307692308" y="121" font-size="13" text-anchor="start">3.7</text>
<text x="238" y="152" font-size="14" text-anchor="end">1  shared-memory tiles</text>
<rect x="250" y="138" width="17.7" height="20" fill="#245ea8"/>
<text x="275.68" y="153" font-size="13" text-anchor="start">3.4</text>
<text x="238" y="184" font-size="14" text-anchor="end">2  register tile</text>
<rect x="250" y="170" width="122.9" height="20" fill="#245ea8"/>
<text x="380.9230769230769" y="185" font-size="13" text-anchor="start">23.5</text>
<text x="238" y="216" font-size="14" text-anchor="end">3  + double buffer</text>
<rect x="250" y="202" width="134.1" height="20" fill="#245ea8"/>
<text x="392.11692307692306" y="217" font-size="13" text-anchor="start">25.6</text>
<text x="238" y="248" font-size="14" text-anchor="end">4  + 128-bit loads</text>
<rect x="250" y="234" width="140.4" height="20" fill="#245ea8"/>
<text x="398.44615384615383" y="249" font-size="13" text-anchor="start">26.9</text>
<text x="238" y="280" font-size="14" text-anchor="end">5  WMMA</text>
<rect x="250" y="266" width="76.5" height="20" fill="#be4d14"/>
<text x="334.5261538461539" y="281" font-size="13" text-anchor="start">14.6</text>
<text x="238" y="312" font-size="14" text-anchor="end">6  mma.sync</text>
<rect x="250" y="298" width="88.7" height="20" fill="#be4d14"/>
<text x="346.71384615384613" y="313" font-size="13" text-anchor="start">17.0</text>
<text x="238" y="344" font-size="14" text-anchor="end">7  pipelined WMMA</text>
<rect x="250" y="330" width="505.8" height="20" fill="#be4d14"/>
<text x="763.7630769230769" y="345" font-size="13" text-anchor="start">96.7</text>
<text x="238" y="376" font-size="14" text-anchor="end">cuBLAS SGEMM</text>
<rect x="250" y="362" width="198.3" height="20" fill="#8c96a3"/>
<text x="456.29846153846154" y="377" font-size="13" text-anchor="start">37.9</text>
<text x="238" y="408" font-size="14" text-anchor="end">cuBLAS FP16</text>
<rect x="250" y="394" width="591.0" height="20" fill="#8c96a3"/>
<text x="848.9723076923077" y="409" font-size="13" text-anchor="start">113</text>
<path d="M 562.2769230769231 92 V 420" stroke="#7a8794" stroke-dasharray="6 5"/>
<text x="556.2769230769231" y="86" font-size="12" text-anchor="end">FP32 peak 59.7</text>
