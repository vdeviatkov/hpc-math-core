title: HPC Math Core
description: Investigations in matrix kernels and memory performance
url: https://vdeviatkov.github.io
baseurl: /hpc-math-core
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
defaults:
  - scope:
      path: ""
    values:
      layout: article
# Project docs and raw experiment data are linked on GitHub, where their
# relative links into the source tree resolve; only the articles and the
# index are published.
exclude:
  - benchmarks.md
  - build.md
  - cache-behavior.md
  - experiments/
