# Build and test on three hosted runners. None has a GPU, an SME-capable CPU
# or a CUDA toolkit, so every job builds the CUDA stub
# (src/cuda/gemm_kernels_stub.cpp) and the SME / KleidiAI kernels are absent.
#
#   linux-x86   GCC 14, HPC_MARCH=x86-64-v3   scalar, AVX2, prefetch
#   linux-arm   GCC 14, -march=native         scalar, NEON, prefetch (SVE if the runner has it)
#   macos       Apple Clang                   scalar, NEON, prefetch, AMX via Accelerate
#
# linux-x86 pins x86-64-v3 because ccache may hand objects to a later job on a
# CPU with different extensions; -march=native objects could then SIGILL.
# It also checks that every CUDA benchmark reports SKIPPED.

name: CI — Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86
            runner: ubuntu-24.04
            cmake_args: -DHPC_MARCH=x86-64-v3
            cuda_smoke: true
          - name: linux-arm
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 ccache ninja-build
          sudo update-alternatives --install /usr/bin/cc  cc  /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-14 100

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache ninja

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'tests/**', 'benchmarks/**') }}
          restore-keys: ccache-${{ matrix.name }}-

      - name: Restore FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.name }}-

      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-junit ${{ github.workspace }}/test-results.xml

      - name: Check that CUDA benchmarks skip without a GPU
        if: matrix.cuda_smoke
        run: |
          ./build/benchmarks/bench_gemm_cuda --benchmark_filter="N=64" \
            --benchmark_min_time=0.01s 2>&1 | tee cuda_bench.txt
          if grep -qP "^\s+\d" cuda_bench.txt; then
            echo "a CUDA benchmark ran on a runner without a GPU"
            exit 1
          fi

      - name: ccache stats
        run: ccache --show-stats

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: test-results.xml
